   <rect x="458" y="15" fill="#ffffe8" width="187" height="35" stroke="#000080" stroke-width="1"/>
   <text x="551" y="31" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Rechazar: el monto cotizado debe ser mayor que </text>
