   <text x="330" y="47" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Todas las acciones: órdenes (ver, editar etapa, </text>
   <text x="330" y="57" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">retroceder y eliminar), clientes (crear, modificar y </text>
