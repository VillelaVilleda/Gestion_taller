services:
  postgres:
    image: postgres:16
    container_name: gestor_taller_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - gestor_taller_data:/var/lib/postgresql/data

volumes:
  gestor_taller_data:
